<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MVP · PS70</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .video-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        align-items: start;
      }

      .video-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .video-embed.vertical {
        padding-top: 177.78%;
        width: 100%;
        max-width: 240px;
        margin: 0;
      }

      .video-embed.vertical.large {
        max-width: 560px;
        margin: 12px auto;
      }

      .video-card .caption {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="logo">PS70</div>
        <nav class="nav">
          <a href="../index.html#projects">Projects</a>
          <a href="../index.html#about">About</a>
        </nav>
        <a class="btn btn-solid" href="../index.html">Home</a>
      </div>
    </header>

    <section class="project-hero">
      <div class="container">
        <p class="eyebrow">Project 07</p>
        <h1>MVP</h1>
        <p class="lead"></p>
      </div>
    </section>

    <section class="project-content">
      <div class="container">
        <div class="section-title" data-animate>
          <h2>Photo Gallery</h2>
        </div>
        <div class="simple-gallery" data-animate>
          <img src="../assets/mvp_0.jpeg" alt="MVP photo 0" />
          <img src="../assets/mvp_00.jpeg" alt="MVP photo 00" />
          <img src="../assets/mvp_1.jpeg" alt="MVP photo 1" />
          <img src="../assets/mvp_2.jpeg" alt="MVP photo 2" />
          <img src="../assets/mvp_3.jpeg" alt="MVP photo 3" />
          <img src="../assets/mvp_4.jpeg" alt="MVP photo 4" />
          <img src="../assets/mvp_5.jpeg" alt="MVP photo 5" />
        </div>
      </div>
    </section>

    <section class="project-content">
      <div class="container">
        <div class="section-title" data-animate>
          <h2>YouTube Gallery</h2>
        </div>
        <div class="video-gallery" data-animate>
          <div class="video-card">
            <div class="video-embed vertical">
              <iframe
                src="https://www.youtube.com/embed/-QSk_n2vlbg"
                title="MVP video 1"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </div>
            <p class="caption">
              Link just in case embed fails:
              <a href="https://youtube.com/shorts/-QSk_n2vlbg?feature=share">Link</a>
            </p>
          </div>
          <div class="video-card">
            <div class="video-embed vertical">
              <iframe
                src="https://www.youtube.com/embed/MnZBZMkxMYc"
                title="MVP video 2"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </div>
            <p class="caption">
              Link just in case embed fails:
              <a href="https://youtube.com/shorts/MnZBZMkxMYc?feature=share">Link</a>
            </p>
          </div>
          <div class="video-card">
            <div class="video-embed vertical">
              <iframe
                src="https://www.youtube.com/embed/44cZJ3HWafI"
                title="MVP video 3"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </div>
            <p class="caption">
              Link just in case embed fails:
              <a href="https://youtube.com/shorts/44cZJ3HWafI?feature=share">Link</a>
            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="project-content">
      <div class="container">
        <div class="section-title" data-animate>
          <h2>Full Demo</h2>
        </div>
        <div class="video-embed vertical large" data-animate>
          <iframe
            src="https://www.youtube.com/embed/RuzufznhiqA"
            title="MVP full demo"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
        <p class="caption">
          Link just in case embed fails:
          <a href="https://youtube.com/shorts/RuzufznhiqA?feature=share">Link</a>
        </p>
      </div>
    </section>

    <section class="project-content">
      <div class="container">
        <div class="section-title" data-animate>
          <h2>Circuit Diagram</h2>
        </div>
        <img src="../assets/mvpcirc.jpeg" alt="Circuit diagram" style="width: 100%; display: block;" />
      </div>
    </section>

    <section class="project-content">
      <div class="container">
        <div class="section-title" data-animate>
          <h2>Fusion Viewer</h2>
        </div>
        <div class="video-embed" data-animate>
          <iframe
            src="https://college654.autodesk360.com/shares/public/SH28cd1QT2badd0ea72b3035202dd6760600?mode=embed"
            title="Fusion 360 viewer"
            allowfullscreen="true"
            webkitallowfullscreen="true"
            mozallowfullscreen="true"
            frameborder="0"
          ></iframe>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container">
        <p><a href="../index.html">Back to home</a></p>
      </div>
    </footer>

    <script src="../script.js"></script>
  </body>
</html>
