    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { STLLoader } from "three/addons/loaders/STLLoader.js";

      const initStlViewer = (canvasId, filePath) => {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const container = canvas.closest(".stl-viewer");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff4ea);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 0, 120);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(40, 60, 80);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const loader = new STLLoader();
        loader.load(filePath, (geometry) => {
          geometry.computeVertexNormals();
          geometry.center();
          const material = new THREE.MeshStandardMaterial({
            color: 0xf66d14,
            metalness: 0.1,
            roughness: 0.35,
          });
          const mesh = new THREE.Mesh(geometry, material);
          scene.add(mesh);

          const box = new THREE.Box3().setFromObject(mesh);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);
          const maxDim = Math.max(size.x, size.y, size.z);
          const fov = (camera.fov * Math.PI) / 180;
          const cameraZ = Math.abs((maxDim / 2) / Math.tan(fov / 2)) * 1.4;

          camera.position.set(center.x, center.y, cameraZ);
          camera.near = maxDim / 100;
          camera.far = maxDim * 10;
          camera.updateProjectionMatrix();
          controls.target.copy(center);
          controls.update();
          render();
        }, undefined, (error) => {
          console.error(`Failed to load STL (${filePath}):`, error);
        });

        const resize = () => {
          const width = container.clientWidth;
          const height = Math.max(320, Math.round(container.clientWidth * 0.6));
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          render();
        };

        const render = () => {
          controls.update();
          renderer.render(scene, camera);
        };

        window.addEventListener("resize", resize);
        resize();
        renderer.setAnimationLoop(render);
      };

      initStlViewer("stl-canvas", "../assets/Box.stl");
      initStlViewer("stl-canvas-2", "../assets/tubelight.stl");
      initStlViewer("stl-canvas-3", "../assets/reed.stl");

    </script>
