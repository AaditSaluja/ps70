<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V-Plotter · PS70</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="logo">PS70</div>
        <nav class="nav">
          <a href="../index.html#projects">Projects</a>
          <a href="../index.html#about">About</a>
        </nav>
        <a class="btn btn-solid" href="../index.html">Home</a>
      </div>
    </header>

    <section class="project-hero">
      <div class="container">
        <p class="eyebrow">Project 10</p>
        <h1>V-Plotter</h1>
        <p class="lead">
          This machine was made in collaboration with
          <a href="https://ilstudente.github.io/PS70/index.html">David Ettel</a>
          and
          <a href="https://qiqi0124.github.io/PS70/index.html">Andrew Chen</a>.
        </p>
      </div>
    </section>

    <section class="project-content">
      <div class="container blog-flow">
        <h2>First Build</h2>
        <div class="simple-gallery" data-animate>
          <img src="../assets/V1.jpg" alt="V-Plotter first build photo 1" />
          <img src="../assets/V2.jpg" alt="V-Plotter first build photo 2" />
          <img src="../assets/V3.jpg" alt="V-Plotter first build photo 3" />
          <img src="../assets/V4.jpg" alt="V-Plotter first build photo 4" />
          <img src="../assets/V5.jpg" alt="V-Plotter first build photo 5" />
          <img src="../assets/V6.jpg" alt="V-Plotter first build photo 6" />
          <img src="../assets/V7.jpg" alt="V-Plotter first build photo 7" />
          <img src="../assets/V8.jpg" alt="V-Plotter first build photo 8" />
          <img src="../assets/V9.jpg" alt="V-Plotter first build photo 9" />
          <img src="../assets/V10.jpg" alt="V-Plotter first build photo 10" />
        </div>
      </div>
    </section>

    <section class="project-content">
      <div class="container blog-flow">
        <h2>Second Build</h2>
        <div class="simple-gallery" data-animate>
          <img src="../assets/2V1.jpg" alt="V-Plotter second build photo 1" />
          <img src="../assets/2V2.jpg" alt="V-Plotter second build photo 2" />
          <img src="../assets/2V3.jpg" alt="V-Plotter second build photo 3" />
          <img src="../assets/2V4.jpg" alt="V-Plotter second build photo 4" />
          <img src="../assets/2V5.jpg" alt="V-Plotter second build photo 5" />
        </div>
      </div>
    </section>

    <section class="project-content">
      <div class="container blog-flow">
        <h2>Code</h2>
        <details class="code-details">
          <summary>Drawing framework</summary>
          <div class="code-block">
            <pre><code data-code-src="../assets/code/vplotter_ui_v2.html.txt">Loading code...</code></pre>
          </div>
        </details>
        <details class="code-details">
          <summary>Arduino code</summary>
          <div class="code-block">
            <pre><code data-code-src="../assets/code/wallplotter.ino.txt">Loading code...</code></pre>
          </div>
        </details>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container">
        <p><a href="../index.html">Back to home</a></p>
      </div>
    </footer>

    <script src="../script.js"></script>
    <script>
      document.querySelectorAll("[data-code-src]").forEach(async (codeBlock) => {
        try {
          const response = await fetch(codeBlock.dataset.codeSrc);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          codeBlock.textContent = await response.text();
        } catch (error) {
          codeBlock.textContent = `Unable to load code snippet: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
